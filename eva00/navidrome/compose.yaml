services:
  navidrome:
    mem_limit: 512m # idle ~30MB; library scans peak >230MB (OOM-looped at 240m)
    image: deluan/navidrome:0.64.2
    container_name: navidrome
    ports:
      - "4533:4533"
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_AUTOIMPORTPLAYLISTS=false
    volumes:
      - /home/lestar/_volumes/navidrome/data:/data
      - /media/downloads/music:/music:ro
    restart: unless-stopped

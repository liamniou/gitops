services:
  navidrome:
    mem_limit: 240m # peak 7d +20%
    image: deluan/navidrome:latest
    container_name: navidrome
    ports:
      - "4533:4533"
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      # Import only MusicGrabber's M3Us, not the .m3u files bundled with album releases.
      - ND_AUTOIMPORTPLAYLISTS=true
      - ND_PLAYLISTSPATH=Playlists:Playlists/**
      # MusicGrabber needs real file paths to write M3U entries for tracks already in the library.
      - ND_SUBSONIC_DEFAULTREPORTREALPATH=true
    volumes:
      - /home/lestar/_volumes/navidrome/data:/data
      - /media/downloads/music:/music:ro
    restart: unless-stopped

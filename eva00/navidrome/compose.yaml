services:
  navidrome:
    mem_limit: 240m # peak 7d +20%
    image: deluan/navidrome:latest
    container_name: navidrome
    ports:
      - "4533:4533"
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_AUTOIMPORTPLAYLISTS=false
    volumes:
      - /home/lestar/_volumes/navidrome/data:/data
      - /media/downloads/music:/music:ro
    restart: unless-stopped

services:
  qpanel:
    # Built by GitHub Actions in github.com/liamniou/qpanel (docker-multiarch workflow).
    image: ghcr.io/liamniou/qpanel:main@sha256:a3d7ddfc98fb3bf6ab5b071de3102fb1251bc1c48380f59aa69cdd974926f942
    container_name: qpanel
    ports:
      - "8081:5001"
    volumes:
      - /home/lestar/_volumes/qpanel/data:/app/data
      - /media/downloads/:/downloads:rw
    environment:
      - TZ=Europe/Stockholm
    restart: unless-stopped

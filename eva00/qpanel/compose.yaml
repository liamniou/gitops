services:
  qpanel:
    # Built by GitHub Actions in github.com/liamniou/qpanel (docker-multiarch workflow).
    image: ghcr.io/liamniou/qpanel:main@sha256:1bc03d431be23ab7dfd611e402cbeb16366586feb027c9bf2443c63e81d757f3
    container_name: qpanel
    ports:
      - "8081:5001"
    volumes:
      - /home/lestar/_volumes/qpanel/data:/app/data
      - /media/downloads/:/downloads:rw
    environment:
      - TZ=Europe/Stockholm
    restart: unless-stopped

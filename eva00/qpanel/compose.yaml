services:
  qpanel:
    # Built by GitHub Actions in github.com/liamniou/qpanel (docker-multiarch workflow).
    image: ghcr.io/liamniou/qpanel:main@sha256:7277fedfc8f0d79e89b7733ff38f4ade0ce19484ddabc1663b9d52871492d013
    container_name: qpanel
    ports:
      - "8081:5001"
    volumes:
      - /home/lestar/_volumes/qpanel/data:/app/data
      - /media/downloads/:/downloads:rw
    environment:
      - TZ=Europe/Stockholm
    restart: unless-stopped

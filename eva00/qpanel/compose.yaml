services:
  qpanel:
    # Built by GitHub Actions in github.com/liamniou/qpanel (docker-multiarch workflow).
    image: ghcr.io/liamniou/qpanel:2026.10.23.9@sha256:7cf55cf2b58ad0f089a2900712049c9c3ace6878cf9d9dbd175558401c9a4fe0
    container_name: qpanel
    ports:
      - "8081:5001"
    volumes:
      - /home/lestar/_volumes/qpanel/data:/app/data
      - /media/downloads/:/downloads:rw
    environment:
      - TZ=Europe/Stockholm
    restart: unless-stopped

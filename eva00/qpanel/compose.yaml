services:
  qpanel:
    # Built by GitHub Actions in github.com/liamniou/qpanel (docker-multiarch workflow).
    image: ghcr.io/liamniou/qpanel:main@sha256:dd7af5a74a8b60404ecd6f47bcd2fc338fa83f9b7dc9bc21dc1210404348e908
    container_name: qpanel
    ports:
      - "8081:5001"
    volumes:
      - /home/lestar/_volumes/qpanel/data:/app/data
      - /media/downloads/:/downloads:rw
    environment:
      - TZ=Europe/Stockholm
    restart: unless-stopped

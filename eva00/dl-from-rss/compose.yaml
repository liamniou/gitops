services:
  bot:
    mem_limit: 112m # peak 7d +20%
    image: ghcr.io/liamniou/dl-yt-from-rss-bot-bot:latest@sha256:91ea1a45cbd5daa97518bdf3225cb97a9fe2423191f7cca0c53395fa6b880d66
    container_name: dl-from-rss-bot
    restart: unless-stopped
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - METUBE_URL=http://localhost:8085
    volumes:
      - /home/lestar/_volumes/dl-from-rss/db:/home/app/db

  checker:
    mem_limit: 64m
    image: ghcr.io/liamniou/dl-yt-from-rss-bot-checker:latest@sha256:773bb39c7ac771b4c7b9a316d9802eb79045412c23f4ce5990982381d78a0225
    container_name: dl-from-rss-checker
    restart: unless-stopped
    network_mode: host
    command: tail -f /dev/null
    environment:
      - RSS_FEED=http://192.168.0.237:1200/youtube/subscriptions
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - MAX_AGE_DAYS=2
    volumes:
      - /home/lestar/_volumes/dl-from-rss/db:/home/app/db
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.dl-rss-checker-08.schedule: "0 8 * * *"
      ofelia.job-exec.dl-rss-checker-08.only-on-success: "false"
      ofelia.job-exec.dl-rss-checker-08.command: "python main.py"
      ofelia.job-exec.dl-rss-checker-16.schedule: "0 16 * * *"
      ofelia.job-exec.dl-rss-checker-16.only-on-success: "false"
      ofelia.job-exec.dl-rss-checker-16.command: "python main.py"

  prefetch:
    mem_limit: 64m
    image: ghcr.io/liamniou/dl-yt-from-rss-bot-prefetch:latest@sha256:86ec1940d0ac86889f32f0dd3b56bbe1973e52a1cad6958e5f918f02c9402f6b
    container_name: dl-from-rss-prefetch
    restart: unless-stopped
    network_mode: host
    environment:
      - PREFETCH_INTERVAL=3600
    volumes:
      - /home/lestar/_volumes/dl-from-rss/db:/home/app/db

services:
  bot:
    mem_limit: 112m # peak 7d +20%
    image: ghcr.io/liamniou/dl-yt-from-rss-bot-bot:2026.10.23.2@sha256:5c2b266028c2138c3ea4e1870adb97f1d3bb49778b231060394ac16f0cc240f7
    container_name: dl-from-rss-bot
    restart: unless-stopped
    network_mode: host
    environment:
      - PYTHONUNBUFFERED=1
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - METUBE_URL=http://localhost:8085
    volumes:
      - /home/lestar/_volumes/dl-from-rss/db:/home/app/db

  checker:
    mem_limit: 64m
    image: ghcr.io/liamniou/dl-yt-from-rss-bot-checker:2026.10.23.2@sha256:dc842dee2bac252962fc709d018897b61354750c2dc98607abe67147fee73f3e
    container_name: dl-from-rss-checker
    restart: unless-stopped
    network_mode: host
    command: tail -f /dev/null
    environment:
      - RSS_FEED=http://192.168.0.237:1200/youtube/subscriptions
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - MAX_AGE_DAYS=2
    volumes:
      - /home/lestar/_volumes/dl-from-rss/db:/home/app/db
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.dl-rss-checker-08.schedule: "0 8 * * *"
      ofelia.job-exec.dl-rss-checker-08.only-on-success: "false"
      ofelia.job-exec.dl-rss-checker-08.command: "python main.py"
      ofelia.job-exec.dl-rss-checker-16.schedule: "0 16 * * *"
      ofelia.job-exec.dl-rss-checker-16.only-on-success: "false"
      ofelia.job-exec.dl-rss-checker-16.command: "python main.py"

  prefetch:
    mem_limit: 64m
    image: ghcr.io/liamniou/dl-yt-from-rss-bot-prefetch:2026.10.23.2@sha256:04f84c3bddc76b03cee4265e326297756ce6a78aa64a12fca7085cf003146011
    container_name: dl-from-rss-prefetch
    restart: unless-stopped
    network_mode: host
    environment:
      - PREFETCH_INTERVAL=3600
    volumes:
      - /home/lestar/_volumes/dl-from-rss/db:/home/app/db

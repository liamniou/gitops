services:
  couchdb:
    mem_limit: 96m
    image: couchdb:3
    container_name: couchdb
    restart: unless-stopped
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    volumes:
      - /home/lestar/_volumes/couchdb/data:/opt/couchdb/data
    ports:
      - 5984:5984

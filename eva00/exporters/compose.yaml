services:
  bus-exporter:
    mem_limit: 64m
    image: ghcr.io/liamniou/bus-exporter:latest@sha256:ac565727c4fce4c35c5036d738e609be28e9f1cb7ad397ecba320caf901b28a4
    container_name: bus-exporter
    restart: unless-stopped
    ports:
      - "9101:9101"
      - "9103:9103"
    environment:
      TZ: Europe/Stockholm

  weather-exporter:
    mem_limit: 64m
    image: ghcr.io/liamniou/weather-exporter:latest@sha256:9a8f9ec42980a0d2d1c786b1c397016e742cbd0f4d0a17d4db4c5f807720b2ea
    container_name: weather-exporter
    restart: unless-stopped
    ports:
      - "9102:9102"
      - "9104:9104"
    environment:
      TZ: Europe/Stockholm

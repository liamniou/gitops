services:
  bus-exporter:
    mem_limit: 64m
    image: ghcr.io/liamniou/bus-exporter:latest@sha256:852f9f03bba2bce06a9146014aa8545ad4956de78531c854f2e5880f9f75b99b
    container_name: bus-exporter
    restart: unless-stopped
    ports:
      - "9101:9101"
      - "9103:9103"
    environment:
      TZ: Europe/Stockholm

  weather-exporter:
    mem_limit: 64m
    image: ghcr.io/liamniou/weather-exporter:latest@sha256:3a0f475296e5fc41bea4848ed5b7cdd77c169f4bed06eea618c6a632ae8a572c
    container_name: weather-exporter
    restart: unless-stopped
    ports:
      - "9102:9102"
      - "9104:9104"
    environment:
      TZ: Europe/Stockholm

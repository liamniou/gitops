services:
  app:
    image: mauriceboe/trek:4.3.3
    container_name: trek
    restart: unless-stopped
    ports:
      - "3011:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: Europe/Stockholm
      LOG_LEVEL: info
      APP_URL: https://trek.tokyo3.eu
      ALLOWED_ORIGINS: https://trek.tokyo3.eu,http://192.168.0.237:3011
      # Trust cloudflared's X-Forwarded-Proto so cookies are Secure over the tunnel;
      # FORCE_HTTPS is left off to keep plain-HTTP LAN access working.
      TRUST_PROXY: "1"
      # Vaultwarden item: trek-eva00
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - /home/lestar/_volumes/trek/data:/app/data
      - /home/lestar/_volumes/trek/uploads:/app/uploads
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - /tmp:noexec,nosuid,size=128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

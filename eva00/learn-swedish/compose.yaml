# Swedish learning portal (flip cards, quizzes, spaced repetition) with server-side progress.
# UI: http://192.168.0.237:7480  (LAN only; per-user PIN login, users in data/users.json on the host)
# Progress: /home/lestar/_volumes/learn-swedish/data/state.json (+ daily snapshots)

services:
  learn-swedish:
    # Built from github.com/liamniou/learn-swedish.
    image: ghcr.io/liamniou/learn-swedish:2026.11.5.9@sha256:eacef02cf918ba9be12f31dfbd849e67da3c12470a78d7e45df39353491feeed
    container_name: learn-swedish
    restart: unless-stopped
    mem_limit: 128m
    user: "1000:1000"
    ports:
      - "7480:8080"
    environment:
      - TZ=Europe/Stockholm
    volumes:
      - /home/lestar/_volumes/learn-swedish/data:/data

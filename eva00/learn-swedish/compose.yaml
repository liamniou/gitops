# Swedish learning portal (flip cards, quizzes, spaced repetition) with server-side progress.
# UI: http://192.168.0.237:7480  (no auth, LAN only)
# Progress: /home/lestar/_volumes/learn-swedish/data/state.json (+ daily snapshots)

services:
  learn-swedish:
    # Built from github.com/liamniou/learn-swedish.
    image: ghcr.io/liamniou/learn-swedish:2026.11.1.3@sha256:a66b3c80fdb752d7dfd15eda7fcf3a8d6e3bf42a5da73bcd9922ec84e786f0f9
    container_name: learn-swedish
    restart: unless-stopped
    mem_limit: 128m
    user: "1000:1000"
    ports:
      - "7480:8080"
    environment:
      - TZ=Europe/Stockholm
    volumes:
      - /home/lestar/_volumes/learn-swedish/data:/data

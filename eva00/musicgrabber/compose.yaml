services:
  music-grabber:
    image: g33kphr33k/musicgrabber:4.3.1
    container_name: music-grabber
    restart: unless-stopped
    # Headless browser fallbacks (Spotify playlists, Monochrome auth) need shared memory.
    shm_size: 2gb
    ports:
      - "38274:8080"
    environment:
      - TZ=Europe/Stockholm
      - PUID=1000
      - PGID=1000
      - MUSIC_DIR=/music
      - DB_PATH=/data/music_grabber.db
      # M3Us land in /music/Playlists, the only folder Navidrome imports playlists from.
      - PLAYLISTS_SUBDIR=Playlists
      # Navidrome lives in another stack, so reach it via the host IP.
      - NAVIDROME_URL=http://192.168.0.237:4533
      - NAVIDROME_USER=Lestar
      # Vaultwarden item: music.tokyo3.eu (login password)
      - NAVIDROME_PASS=${NAVIDROME_PASS}
    volumes:
      - /home/lestar/_volumes/musicgrabber/data:/data
      # Same in-container path as Navidrome so its real paths resolve for M3U entries.
      - /media/downloads/music:/music

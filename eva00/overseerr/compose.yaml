services:
  overseerr:
    mem_limit: 400m # peak 7d +20%
    image: ghcr.io/liamniou/overseerr:2026.10.23.3@sha256:edb2b5b0b0bd50f65c971cb6d2f527baa9933aef3e5ab86acbad0259820643f6
    container_name: overseerr
    restart: unless-stopped
    environment:
      - TZ=Europe/Stockholm
      - PORT=5055
    ports:
      - "5055:5055"
    volumes:
      - /home/lestar/_volumes/overseerr/configs:/app/config

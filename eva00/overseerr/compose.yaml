services:
  overseerr:
    mem_limit: 400m # peak 7d +20%
    image: ghcr.io/liamniou/overseerr:2026.11.20.4@sha256:4a5a799334c43b416d6d214300b096c6cac01dce4417bd9e64edca73b7dac3b7
    container_name: overseerr
    restart: unless-stopped
    environment:
      - TZ=Europe/Stockholm
      - PORT=5055
    ports:
      - "5055:5055"
    volumes:
      - /home/lestar/_volumes/overseerr/configs:/app/config

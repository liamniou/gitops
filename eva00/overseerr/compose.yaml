services:
  overseerr:
    mem_limit: 400m # peak 7d +20%
    image: ghcr.io/liamniou/overseerr:latest@sha256:3bde08e3aef4c01819357bf4f5fded321742448af3d40638d4911845d64261ab
    container_name: overseerr
    restart: unless-stopped
    environment:
      - TZ=Europe/Stockholm
      - PORT=5055
    ports:
      - "5055:5055"
    volumes:
      - /home/lestar/_volumes/overseerr/configs:/app/config

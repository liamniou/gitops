services:
  caddy:
    mem_limit: 64m # peak 14d +25%
    image: caddy:2.11.7-alpine
    container_name: caddy
    ports:
      - "8090:8090"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/lestar/_volumes/caddy/site:/srv:ro
      - /media/caddy:/downloads:ro
      - /home/lestar/_volumes/caddy/data:/data
      - /home/lestar/_volumes/caddy/config:/config
    environment:
      - TZ=Europe/Stockholm
      # Vaultwarden item: caddy-eva00
      - CADDY_BASIC_AUTH_USER=${CADDY_BASIC_AUTH_USER}
      - CADDY_BASIC_AUTH_HASH=${CADDY_BASIC_AUTH_HASH}
    restart: unless-stopped

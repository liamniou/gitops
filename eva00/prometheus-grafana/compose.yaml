services:
  # =============================================================================
  # PROMETHEUS - Storage only (receives remote writes from Alloy, serves queries)
  # =============================================================================
  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
      - '--web.enable-admin-api'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'
    ports:
      - 9090:9090
    restart: unless-stopped
    volumes:
      - /home/lestar/_volumes/prometheus/configs:/etc/prometheus:ro
      - /home/lestar/_volumes/prometheus/data:/prometheus

  # =============================================================================
  # GRAFANA - Visualization
  # =============================================================================
  grafana:
    image: grafana/grafana:13.0.1-security-01
    container_name: grafana
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=Lestar
      # Vaultwarden item: prometheus-grafana-eva00
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - grafana_storage:/var/lib/grafana
      - /home/lestar/_volumes/grafana/configs:/etc/grafana/provisioning/datasources
      - /home/lestar/_volumes/grafana/configs/dashboards:/etc/grafana/provisioning/datasources/dashboards
      - /home/lestar/_volumes/grafana/configs/dashboard-provisioning.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - /home/lestar/_volumes/grafana/data:/var/lib/grafana/plugins
      - /home/lestar/_volumes/grafana/configs/config/grafana.ini:/etc/grafana/grafana.ini

volumes:
  grafana_storage: {}

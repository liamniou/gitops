services:
  rsshub:
    mem_limit: 176m # peak 14d +25%
    container_name: rsshub
    image: diygod/rsshub:latest@sha256:0e93cec4ee2860e014c74049d9890f176e9debab6bd0572891246f858ea0d003
    restart: always
    ports:
      - '1200:1200'
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: 'redis://redis:6379/'
      PUPPETEER_WS_ENDPOINT: 'ws://browserless:3000'
      YOUTUBE_CLIENT_ID: '164043742360-7ncd82a3k5kkqvgmrf89ra1so4h01svb.apps.googleusercontent.com'
      # Vaultwarden item: rsshub-eva00
      YOUTUBE_KEY: ${YOUTUBE_KEY}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET}
      YOUTUBE_REFRESH_TOKEN: ${YOUTUBE_REFRESH_TOKEN}
    depends_on:
      - redis
      - browserless

  browserless:
    mem_limit: 608m # peak 14d +25%
    # browserless/chrome (v1) is unmaintained; v2 still accepts puppeteer at ws://browserless:3000.
    image: ghcr.io/browserless/chromium:v2.60.0@sha256:a9c2dea3399449e1b1f47cf49d33ee249e8aa9bd9222567a0224d52f4bb24602
    restart: always
    ulimits:
      core:
        hard: 0
        soft: 0

  redis:
    mem_limit: 64m # peak 14d +25%
    image: redis:7.2.3-alpine3.18
    restart: always
    volumes:
      - redis-data:/data

volumes:
  redis-data:

services:
  crowbarr:
    image: ghcr.io/amanofvaly/crowbarr:latest-cuda@sha256:53dc3f864e334388657a7324d625f3e3c4198adf8d31b11e05dfaf4479ad297f
    container_name: crowbarr
    profiles: ["disabled"]  # was not running at migration time; remove to enable
    restart: unless-stopped
    init: true
    # Match Sonarr/Radarr (PUID/PGID 1000) so Crowbarr can write subtitles next to media.
    user: "1000:1000"
    environment:
      - TZ=Europe/Stockholm
    ports:
      - 8449:8449
    volumes:
      - /home/lestar/_volumes/crowbarr/config:/config
      # Same mount as Sonarr/Radarr so reported paths match; no path mappings needed.
      - /media:/media
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

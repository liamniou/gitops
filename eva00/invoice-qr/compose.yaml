services:
  invoice-qr:
    mem_limit: 512m
    image: ghcr.io/liamniou/invoice-qr:latest@sha256:f2d890efb7f6b14f849c8055ad9aadc0d9982ea5f61b12b6742696339af7e5a4
    container_name: invoice-qr
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/')"]
      interval: 30s
      timeout: 5s
      retries: 3

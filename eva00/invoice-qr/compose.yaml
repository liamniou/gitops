services:
  invoice-qr:
    mem_limit: 512m
    image: ghcr.io/liamniou/invoice-qr:latest@sha256:72d5360b2e3bcc55113590968c05226a277e5c245a6bde4c65f97602797a34b8
    container_name: invoice-qr
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/')"]
      interval: 30s
      timeout: 5s
      retries: 3

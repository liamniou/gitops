services:
  cross-seed:
    profiles: ["disabled"]  # remove to enable
    command: daemon
    container_name: cross-seed
    image: ghcr.io/cross-seed/cross-seed
    restart: unless-stopped
    user: 1000:1000
    ports:
      - 2468:2468
    volumes:
      - /home/lestar/_volumes/cross-seed/configs:/config
      - /home/lestar/_volumes/cross-seed/data/input:/torrents:ro
      - /home/lestar/_volumes/cross-seed/data/output:/cross-seeds
      - /media/downloads:/media/downloads

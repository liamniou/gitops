services:
  # Standalone GitHub Copilot -> OpenAI-compatible proxy (no VS Code needed).
  copilot-api:
    # Built from github.com/liamniou/copilot-api (fork of ericc-ch/copilot-api at v0.7.0).
    image: ghcr.io/liamniou/copilot-api:latest@sha256:dde6f91c56462fa61dc1a887c2d9a18cd41f4c12baaa7a28273861296a1189f1
    container_name: copilot-api
    restart: unless-stopped
    ports:
      # Published for OpenAI-compatible clients on the LAN (collecta uses it).
      - "4141:4141"
    volumes:
      # Persists the GitHub token so auth survives restarts.
      - copilot-data:/root/.local/share/copilot-api
    configs:
      # Bun.serve's default 10s idle timeout drops streams that go quiet mid-response
      # (long tool-call arguments), e.g. Omnara agents. bunfig.toml preloads a shim that disables it.
      - source: copilot-no-idle-timeout
        target: /app/no-idle-timeout.js
      - source: copilot-bunfig
        target: /app/bunfig.toml
  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:4e1dd31538187a4c5749b30880dbc8ae745b2827cf9016cbfd691b431199b230
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - copilot-api
    ports:
      - "8084:8080"
    environment:
      - OPENAI_API_BASE_URL=http://copilot-api:4141/v1
      # Vaultwarden item: openwebui-eva00
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ENABLE_OLLAMA_API=false
    volumes:
      - open-webui:/app/backend/data

volumes:
  copilot-data:
  open-webui:

configs:
  copilot-no-idle-timeout:
    content: |
      const serve = Bun.serve;
      Bun.serve = (options) => serve({ ...options, idleTimeout: 0 });
  copilot-bunfig:
    content: |
      preload = ["./no-idle-timeout.js"]

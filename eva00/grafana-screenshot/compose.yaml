services:
  grafana-screenshot:
    image: ghcr.io/liamniou/grafana-screenshot:2026.10.23.3@sha256:a03331d0d83ef48829b26182437bdf79fb2f682b56f996f42b782c61b43d36ae
    container_name: grafana-screenshot
    restart: unless-stopped
    # Reap Chromium children left behind when Playwright screenshots time out.
    init: true
    pids_limit: 256
    ports:
      - "8087:8080"
    environment:
      GRAFANA_URL: "http://192.168.0.237:3000/d/bus-weather-dashboard/bus-departures-and-weather?orgId=1&from=now-6h&to=now%2B12h&timezone=browser&kiosk"
      SCREENSHOT_INTERVAL: "15"
      WIDTH: "800"
      HEIGHT: "480"
      HTTP_PORT: "8080"
    shm_size: 128m
    mem_limit: 768m
    memswap_limit: 1g

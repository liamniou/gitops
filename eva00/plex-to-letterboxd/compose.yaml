# Plex watch history -> Letterboxd diary, as a service with memory (SQLite) and a web UI.
# UI: http://192.168.0.237:7477  (no auth, LAN only)
# Scheduling is built in (Settings page); Tautulli can trigger a sync via
# POST http://192.168.0.237:7477/api/webhook/tautulli
# One-shot CLI run: docker exec plex-to-letterboxd python main.py sync

services:
  plex-to-letterboxd:
    # Built from github.com/liamniou/plex-to-letterboxd.
    image: ghcr.io/liamniou/plex-to-letterboxd:2026.10.25.7@sha256:9fad0f4d2ca780b86ff0aa5877fd85c1c1c725868380ca885cc2477a4c220e38
    container_name: plex-to-letterboxd
    restart: unless-stopped
    ports:
      - "7477:7477"
    environment:
      - TZ=Europe/Stockholm
      - PLEX_URL=http://192.168.0.237:32400
      - PLEX_PUBLIC_URL=https://plex.tokyo3.eu
      - PLEX_USER=
      - PLEX_LIBRARY=Films
      - MAX_RETRIES=3
      # Vaultwarden item: plex-to-letterboxd-eva00
      - PLEX_TOKEN=${PLEX_TOKEN}
      - LETTERBOXD_USERNAME=${LETTERBOXD_USERNAME}
      - LETTERBOXD_PASSWORD=${LETTERBOXD_PASSWORD}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    volumes:
      - /home/lestar/_volumes/plex-to-letterboxd/data:/data

services:
  fetch_ratio:
    mem_limit: 80m # peak 7d +20%
    image: ghcr.io/liamniou/fetch_ratio:2026.10.23.3@sha256:a8670e001b600cb0510447ca6cd4da2385162682dc45a2ce95b6dea99db00c0d
    container_name: fetch_ratio
    restart: unless-stopped
    ports:
      - "17500:17500"
    environment:
      EXPORTER_PORT: "17500"
      FETCH_INTERVAL: "3600"
      MAX_RETRIES: "3"
      RETRY_DELAY: "30"
      REQUEST_TIMEOUT: "30"
      SITES_CONFIG: ${SITES_CONFIG}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}

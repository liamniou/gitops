services:
  fetch_ratio:
    mem_limit: 64m
    image: ghcr.io/liamniou/fetch_ratio:latest
    container_name: fetch_ratio
    restart: unless-stopped
    ports:
      - "17500:17500"
    environment:
      EXPORTER_PORT: "17500"
      FETCH_INTERVAL: "3600"
      MAX_RETRIES: "3"
      RETRY_DELAY: "30"
      REQUEST_TIMEOUT: "30"
      SITES_CONFIG: ${SITES_CONFIG}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}

services:
  radarr-ru:
    container_name: radarr-ru
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Stockholm
      - DOTNET_STARTUP_HOOKS=/patch/RadarrNativeTitle.dll
      # Vaultwarden item: radarr-ru-eva00
      - RADARR_TMDB_API_KEY=${RADARR_TMDB_API_KEY}
      - RADARR_TMDB_TITLE_LANGS=ru
      - RADARR_NATIVE_TITLE_DEBUG=1
    healthcheck:
      interval: 1h
      retries: 3
      test:
        - CMD
        - ls
        - -al
        - /mnt
      timeout: 10s
    # Built from github.com/liamniou/arr-ru-patches (linuxserver/radarr + /patch hook DLLs).
    # Pin the sha- tag, not :latest — Dependabot titles digest-only bumps "latest to latest".
    image: ghcr.io/liamniou/radarr-ru:sha-48d1814@sha256:6ad93f2647a80736552ae004b5c03b414d65a25a28d96cb161ae474989306416
    ports:
      - 7879:7878
    restart: unless-stopped
    volumes:
      - /home/lestar/_volumes/radarr-ru/configs:/config
      - /media:/media

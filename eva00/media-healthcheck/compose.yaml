services:
  media-healthcheck:
    image: python:3-alpine
    container_name: media-healthcheck
    command: python /app/server.py
    ports:
      - "8088:8080"
    environment:
      - MEDIA_PATH=/media
      - PORT=8080
    volumes:
      - ./server.py:/app/server.py:ro
      - /home/lestar/media/downloads/music:/media:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

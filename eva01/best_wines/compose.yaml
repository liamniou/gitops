services:
  web:
    image: ghcr.io/liamniou/best-wines-in-sweden-web:latest@sha256:4169e4c6dd857f2683d137655cf4067a4cb1cf17e802b2da8fe42b8405ea68c7
    container_name: best_wines
    restart: unless-stopped
    ports:
      - "8005:8000"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MATCH_THRESHOLD: ${MATCH_THRESHOLD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SEARCH_API_KEY: ${SEARCH_API_KEY}
      GOOGLE_CUSTOM_SEARCH_API_KEY: ${GOOGLE_CUSTOM_SEARCH_API_KEY}
      ZENSERP_API_KEY: ${ZENSERP_API_KEY}
    volumes:
      - /home/lestar/_volumes/best_wines/data:/app/data
      - /home/lestar/_volumes/best_wines/static_site:/app/static_site
      - /home/lestar/_volumes/best_wines/verified_matches.json:/app/verified_matches.json:ro
    command: uvicorn static_server:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

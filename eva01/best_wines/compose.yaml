services:
  web:
    image: ghcr.io/liamniou/best-wines-in-sweden-web:latest
    container_name: best_wines
    restart: unless-stopped
    ports:
      - "8005:8000"
    env_file:
      - /home/lestar/_volumes/best_wines/.env
    volumes:
      - /home/lestar/_volumes/best_wines/data:/app/data
      - /home/lestar/_volumes/best_wines/static_site:/app/static_site
      - /home/lestar/_volumes/best_wines/verified_matches.json:/app/verified_matches.json:ro
    command: uvicorn static_server:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

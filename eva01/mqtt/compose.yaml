services:
  mqtt:
    mem_limit: 64m
    image: eclipse-mosquitto:2.0.22
    container_name: mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - /home/lestar/_volumes/mqtt/config:/mosquitto/config
      - /home/lestar/_volumes/mqtt/data:/mosquitto/data
      - /home/lestar/_volumes/mqtt/log:/mosquitto/log
    environment:
      TZ: Europe/Stockholm

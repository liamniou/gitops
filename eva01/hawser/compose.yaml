services:
  hawser:
    mem_limit: 64m
    image: ghcr.io/finsys/hawser:0.2.46
    container_name: hawser
    restart: unless-stopped
    environment:
      TZ: Europe/Stockholm
      ALLOW_INSECURE_NO_AUTH: "true"
    ports:
      - "2376:2376"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes/doco-cd_data/_data/github.com/liamniou/gitops/eva01:/stacks:ro
      - data:/data/stacks

volumes:
  data:

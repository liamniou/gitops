services:
  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:2.11.0
    container_name: zigbee2mqtt
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /home/lestar/_volumes/zigbee2mqtt/data:/app/data
    environment:
      TZ: Europe/Stockholm
    devices:
      - /dev/ttyACM0:/dev/ttyACM0

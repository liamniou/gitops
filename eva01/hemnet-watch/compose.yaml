# Hemnet Watch: archive of hemnet.se listings + per-user email alerts.
# UI: http://192.168.0.238:8099  (LAN only; sign-in via emailed code/link)
# Data: /home/lestar/_volumes/hemnet-watch/data (SQLite) on eva01
# Images: eva00 (192.168.0.237) /5TB/hemnet-watch/images (= /media/hemnet-watch) via NFS
# Secrets: Vaultwarden item hemnet-watch-eva01

services:
  hemnet-watch:
    # Built from github.com/liamniou/hemnet_parser_bot.
    image: ghcr.io/liamniou/hemnet_parser_bot:2026.11.25.36@sha256:7df678b50e65e389bfb4335462bdb39dbb7ec79c99dba7826d412d8f4297e940
    container_name: hemnet-watch
    restart: unless-stopped
    mem_limit: 512m
    user: "1000:1000"
    ports:
      - "8099:8000"
    environment:
      TZ: Europe/Stockholm
      PUBLIC_URL: http://192.168.0.238:8099
      SCAN_INTERVAL_MINUTES: "120"
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      SMTP_HOST: in-v3.mailjet.com
      SMTP_PORT: "587"
      SMTP_SECURITY: starttls
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: Hemnet Watch <hemnet@tokyo3.eu>
    volumes:
      - /home/lestar/_volumes/hemnet-watch/data:/data
      - images-5tb:/data/images
    security_opt:
      - no-new-privileges:true

volumes:
  images-5tb:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.0.237,nfsvers=4.2,rw,hard,noatime
      device: ":/5TB/hemnet-watch/images"

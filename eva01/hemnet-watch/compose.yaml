# Hemnet Watch: archive of hemnet.se listings + per-user email alerts.
# UI: http://192.168.0.238:8099  (LAN only; sign-in via emailed code/link)
# Data: /home/lestar/_volumes/hemnet-watch/data (SQLite + archived images)
# Secrets: Vaultwarden item hemnet-watch-eva01

services:
  hemnet-watch:
    # Built from github.com/liamniou/hemnet_parser_bot.
    image: ghcr.io/liamniou/hemnet_parser_bot:2026.11.24.8@sha256:73ecd31286c7479e6de04e8037da697e53cbffe064b27caf65679591db09583c
    container_name: hemnet-watch
    restart: unless-stopped
    mem_limit: 512m
    user: "1000:1000"
    ports:
      - "8099:8000"
    environment:
      TZ: Europe/Stockholm
      PUBLIC_URL: http://192.168.0.238:8099
      SCAN_INTERVAL_MINUTES: "120"
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      SMTP_HOST: in-v3.mailjet.com
      SMTP_PORT: "587"
      SMTP_SECURITY: starttls
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: Hemnet Watch <hemnet@tokyo3.eu>
    volumes:
      - /home/lestar/_volumes/hemnet-watch/data:/data
    security_opt:
      - no-new-privileges:true
